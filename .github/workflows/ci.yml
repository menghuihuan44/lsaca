# Continuous integration for the lsaca compiler workspace.
#
# The compiler emits C17 code and by default builds it with the system C
# compiler directly (CMake is an optional backend behind `--cmake`), so every
# test runner needs a C toolchain in addition to a Rust toolchain; the CMake
# jobs below install CMake and Ninja as well.
#
# Jobs:
#   fmt          rustfmt check
#   clippy       clippy over all targets, warnings denied
#   test         cargo test --workspace on Linux, macOS and Windows
#   docs         rustdoc build with warnings denied
#   runtime      the generated-program C runtime smoke test (gcc, C17)
#   sanitizers   the C runtime and every generated example under ASan + UBSan
#   generated-c  emit C for every example, compile with -Werror, run hello,
#                and build one generated project through CMake + Ninja
#   docs-examples run every runnable documentation example against the release
#                compiler and compare stdout, exit code and panic messages
#   site         validate the markdown documentation (internal links, external
#                files, documented version claims, benchmark tables) and build
#                the static site
#
# The Pages deployment lives in pages.yml; the optional benchmark smoke run
# lives in benchmark-smoke.yml.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# CI only needs to read the repository: no job writes to it.
permissions:
  contents: read

# Superseded runs on the same branch are cancelled, but a run for main is never
# cancelled half way through.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: clippy
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the C toolchain, CMake and Ninja (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc cmake ninja-build

      - name: Install CMake and Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Install the C toolchain, CMake and Ninja (Windows, MSYS2 UCRT64)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja

      # The MSYS2 action only exports its environment to steps that use the
      # MSYS2 shell, so put the UCRT64 toolchain on PATH explicitly. The e2e
      # tests invoke gcc, cmake and ninja as child processes.
      - name: Put the MSYS2 UCRT64 toolchain on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}

      - name: Run the workspace tests
        run: cargo test --workspace

  docs:
    name: Rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: docs
      - name: Build the API documentation
        run: cargo doc --workspace --no-deps

  runtime:
    name: C runtime smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Install the C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libc6-dev
      # The runtime is deliberately standalone: it does not need cargo or CMake,
      # so this job proves that the C17 sources build with a plain gcc.
      - name: Build and run the smoke test (release build)
        run: |
          gcc -std=c17 -Wall -Wextra -Werror -O2 -DNDEBUG -I runtime \
            runtime/test/main.c runtime/lsaca_rt.c runtime/lsaca_rt_string.c \
            runtime/lsaca_rt_vec.c runtime/lsaca_rt_fmt.c runtime/lsaca_rt_map.c \
            -lm -o rt-test
          ./rt-test
      - name: Build and run the smoke test (debug build with leak tracking)
        run: |
          gcc -std=c17 -Wall -Wextra -Werror -O0 -g -DLSACA_DEBUG -DLSACA_DEBUG_RC \
            -I runtime runtime/test/main.c runtime/lsaca_rt.c runtime/lsaca_rt_string.c \
            runtime/lsaca_rt_vec.c runtime/lsaca_rt_fmt.c runtime/lsaca_rt_map.c \
            -lm -o rt-test-debug
          ./rt-test-debug
      # Panic paths call exit(101); a bash script must not treat that as an
      # unhandled failure before inspecting the output.
      - name: Check panic exits and the debug leak report
        shell: bash
        run: |
          set +e
          ./rt-test-debug --panic-div-zero > /dev/null 2> panic.txt
          panic_status=$?
          set -e
          if [ "$panic_status" -ne 101 ]; then
            echo "expected panic exit code 101, got $panic_status"
            cat panic.txt
            exit 1
          fi
          grep -F "thread 'main' panicked at smoke.c:3:9:" panic.txt
          grep -F "attempt to divide by zero" panic.txt
          set +e
          ./rt-test-debug --leak > /dev/null 2> leak.txt
          leak_status=$?
          set -e
          if [ "$leak_status" -ne 0 ]; then
            echo "expected leak-reporting run to exit 0, got $leak_status"
            cat leak.txt
            exit 1
          fi
          grep -F "reference-counted allocation(s) leaked" leak.txt

  sanitizers:
    name: Address and UB sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Leak detection matters for the ORC runtime: a generated program that
      # reaches its epilogue must have released every reference-counted object.
      ASAN_OPTIONS: "detect_leaks=1:abort_on_error=0"
      UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Install the C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libc6-dev
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: sanitizers
      # The runtime is compiled with its own test driver so the complete
      # allocation matrix (strings, vectors, closures, facts, Rc cells and the
      # cycle collector) executes under the sanitizers.
      - name: Build and run the C runtime smoke test under ASan and UBSan
        run: |
          gcc -std=c17 -Wall -Wextra -Werror -O1 -g -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I runtime runtime/test/main.c \
            runtime/lsaca_rt.c runtime/lsaca_rt_string.c runtime/lsaca_rt_vec.c \
            runtime/lsaca_rt_fmt.c runtime/lsaca_rt_map.c -lm -o rt-test-san
          ./rt-test-san
          ./rt-test-san --orc-shutdown
          ./rt-test-san --leak
      # Panics call exit(101); check the diagnostics still reach stderr cleanly
      # while ASan intercepts the allocator.
      - name: Check the panic path under the sanitizers
        shell: bash
        run: |
          set +e
          ./rt-test-san --panic-div-zero > /dev/null 2> panic.txt
          status=$?
          set -e
          if [ "$status" -ne 101 ]; then
            echo "expected panic exit code 101, got $status"
            cat panic.txt
            exit 1
          fi
          grep -F "attempt to divide by zero" panic.txt
      - name: Build the release CLI
        run: cargo build --release -p lsaca-cli
      # Every example is lowered to C, compiled with the sanitizers and run, so
      # generated pointer arithmetic, borrowed places and refcount traffic are
      # all checked by ASan/UBSan.
      - name: Emit and run every example under the sanitizers
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          for example in examples/*.ls; do
            name="$(basename "$example" .ls)"
            out="$workdir/$name"
            ./target/release/lsaca emit-c -r -o "$out" "$example"
            gcc -std=c17 -Wall -Wextra -Werror -O1 -g -fsanitize=address,undefined \
              -fno-omit-frame-pointer -I "$out" "$out/main.c" "$out"/lsaca_rt*.c \
              -lm -o "$out/$name"
            "$out/$name" > /dev/null
          done

  generated-c:
    name: Generated C is warning-free
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Install the C toolchain, CMake and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc cmake ninja-build
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: generated-c
      - name: Build the release CLI
        run: cargo build --release -p lsaca-cli
      # Every example is lowered to C and compiled with -Werror so accidental
      # warnings in generated code fail CI. One generated project is also built
      # through the CMake + Ninja backend to cover the real driver path.
      - name: Emit, compile and run every example
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "Generated projects are written to $workdir"
          for example in examples/*.ls; do
            name="$(basename "$example" .ls)"
            out="$workdir/$name"
            echo "::group::Generating $name"
            ./target/release/lsaca emit-c -r -o "$out" "$example"
            gcc -std=c17 -Wall -Wextra -Werror -O2 -DNDEBUG -I "$out" \
              "$out/main.c" "$out"/lsaca_rt*.c -lm -o "$out/$name"
            if [ "$name" = "hello" ]; then
              output="$("$out/$name")"
              if [ "$output" != "hello, world!" ]; then
                echo "unexpected hello output: $output"
                exit 1
              fi
            fi
            echo "::endgroup::"
          done
          # The runtime is split into several translation units; every emitted
          # project must contain all of them (the driver writes runtime::sources()).
          units=$(ls "$workdir/hello"/lsaca_rt*.c | wc -l)
          if [ "$units" -ne 5 ]; then
            echo "expected 5 emitted runtime translation units, found $units"
            exit 1
          fi
          cmake -S "$workdir/hello" -B "$workdir/hello/build" -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "$workdir/hello/build"
      # Borrowed places, reference-counted cells, move flags, Drop hooks and
      # clone helpers exercise const-qualified accessors, ORC drops and the
      # ownership protocol, so a discarded-qualifier, unused-variable or
      # missing-helper regression in generated C fails here even when the
      # compiler's own unit tests do not cover the corresponding fixture.
      # scripts/check_generated_c.py is the exhaustive generated-C gate: it
      # emits every example and every positive fixture twice (byte-identical
      # determinism), validates the emitted project file set, compiles with
      # -std=c17 -Wall -Wextra -Wpedantic -Werror in the release AND debug
      # profiles, then runs each program requiring exit code 0 and an empty
      # stderr (so leaked reference-counted allocations fail as well). Known
      # negative fixtures are annotated inside the script.
      - name: Emit, compile and run every program in both profiles
        run: |
          set -euo pipefail
          python scripts/check_generated_c.py \
            --bin ./target/release/lsaca \
            --profile both \
            --json target/generated-c-report.json

  docs-examples:
    name: Documentation examples
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Install the C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: docs-examples
      - name: Build the release CLI
        run: cargo build --release -p lsaca-cli
      # Every fenced example in docs/ is compiled and run through the official
      # driver: compile-only examples are type checked, panic examples must
      # exit 101 with the documented message, release examples are built with
      # optimisations and args/stdin examples get the documented input, so a
      # stale expected output or a semantic regression fails this job.
      - name: Run every documentation example
        run: python scripts/docs_verify.py --bin ./target/release/lsaca

  site:
    name: Documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the documentation links
        run: python scripts/docsite.py --check
      - name: Check every markdown link
        run: python scripts/linkcheck.py
      - name: Check documented version claims
        run: python scripts/prose_check.py
      - name: Validate the published benchmark tables
        run: python scripts/check_bench21.py
      - name: Build the static site
        run: python scripts/docsite.py --output _site
      # Prove the generator actually produced a browsable tree before uploading.
      - name: Sanity check the generated site
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          pages="$(find _site -name '*.html' | wc -l)"
          echo "generated $pages HTML page(s)"
          test "$pages" -ge 1
      - name: Upload the site as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: _site
          retention-days: 7
